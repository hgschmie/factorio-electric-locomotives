[mod-setting-description]
hps__elok-enable_train=Enables improved locomotives.
hps__elok-enable_cargo=Enables improved cargo wagons.
hps__elok-enable_fluid=Enables improved fluid wagons.
hps__elok-show_icons=If checked, Locomotive icons that mark them as electric and show their tier area always displayed, otherwise only in Alt-mode.
hps__elok-unlock_max_speed=Normally, all cargo, fluid and other wagons have a max speed which determines the maximum speed of a train. Enabling this setting will allow all wagons to run at the maximum speed of the maximum unlocked engine tier (or faster).
hps__elok-tick_interval=Controls how often each engine is checked for electric energy. Higher values are good for UPS/FPS but engines may run longer if power goes out.
hps__elok-engines_per_control_station=Each control station can support a number of engines at full power. Setting this number higher requires fewer control stations to power a large number of locomotives. Setting it lower allows controlling the power draw of control stations better.
hps__elok-debug-mode=Enable debugging of the Electric Locomotives code.
